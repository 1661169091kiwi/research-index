# The iPhone app: an unsigned .ipa built on a Mac runner (Windows cannot build iOS apps).
# Install it with Sideloadly or AltStore, which sign it with your own Apple ID (see mobile/README.md).
#   - by hand: Actions → "iOS build" → Run workflow; the .ipa is under the run's Artifacts
#   - on every published release: the .ipa is also attached to that release
name: iOS build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Packages (the page build, and Capacitor)
        run: |
          npm ci --omit=dev --ignore-scripts
          npm ci --prefix mobile

      - name: Build the .ipa
        run: node scripts/ios.mjs --no-seed

      - uses: actions/upload-artifact@v4
        with:
          name: research-index-ios
          path: release/*.ipa
          if-no-files-found: error

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/*.ipa --clobber
